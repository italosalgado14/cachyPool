background {
    monitor =
    path = ~/Pictures/Wallpapers/wall.jpg
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 280, 50
    position = 0, -100
    halign = center
    valign = center
    outline_thickness = 2
    inner_color = rgba(30, 30, 46, 0.85)
    outer_color = rgba(203, 166, 247, 0.85)
    font_color = rgba(205, 214, 244, 1.0)
    placeholder_text = <i>Password...</i>
    fade_on_empty = true
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 90
    font_family = JetBrains Mono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# >>> triton-panel: fingerprint unlock >>>
# Written by Triton Panel. hyprlock talks to fprintd over D-Bus directly -- this
# needs no PAM change, which is why unlocking by fingerprint carries none of the
# lockout risk a /etc/pam.d edit would. Password auth stays on regardless.
auth {
    fingerprint {
        enabled = true
        ready_message = (Touch finger to unlock)
        present_message = Scanning fingerprint
        retry_delay = 250
    }
}
# <<< triton-panel: fingerprint unlock <<<
