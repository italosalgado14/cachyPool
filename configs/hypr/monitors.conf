# Monitor geometry + workspace bindings — the boot default ("desktop" 3-across).
#
# Monitors are matched by EDID DESCRIPTION (`desc:`), not by port name. DP-1 and
# DP-2 swap with plug order on this machine (both externals arrive as DP tunnels
# over the single Thunderbolt connector, so whichever trains first wins the low
# number). Name-bound rules silently sent workspaces 1-3 — the primary set — to
# the 16" portable while the 27" Xiaomi got the overflow workspaces 6-9.
#
# `desc:` is a PREFIX match against the string `hyprctl monitors` prints as
# "description", so the trailing serial is omitted on purpose. Check current
# descriptions with:  hyprctl monitors -j | jq -r '.[] | "\(.name) = \(.description)"'
#
# eDP-1 keeps its port name: the built-in panel never floats, and the profile
# scripts address it by name (`keyword monitor eDP-1,disable`).
#
# Geometry here is only the BOOT DEFAULT. monitor-autoswitch.sh applies a
# capability-resolved profile a moment after login — see scripts/monitor-mode.sh.

# Laptop built-in (leftmost) — 16" HiDPI, 240Hz, scale 1.25 -> 2048 logical wide
monitor = eDP-1, 2560x1600@240, 0x0, 1.25

# Xiaomi 27" 4K (center) — PRIMARY, 60Hz, scale 1.25 -> 3072x1728 logical.
# Replaced the Samsung FHD 24" on 2026-07-11; the 3-across offsets below were
# re-fitted for its wider logical size on 2026-08-03 (the Samsung was 1920).
monitor = desc:Xiaomi Corporation Mi Monitor, 3840x2160@60, 2048x0, 1.25

# Portable QHD 16" (right) — VCHANCE AQ16H, native 2560x1600@120, scale 1.25
# -> 2048x1280 logical landscape (1280x2048 when the "read" profile rotates it).
# NOTE: the AQ16H's Realtek scaler publishes no vendor string, so Hyprland shows
# it as "Invalid Vendor Codename - RTK HDMI" with a placeholder serial
# (0x01010101) — that junk string is the match key below, and the serial cannot
# disambiguate. The demoset FHD portable used on the road is distinguished by
# "demoset" in its description, so this prefix does not collide with it — but
# re-check if a third generic RTK-scaler panel ever appears.
monitor = desc:Invalid Vendor Codename - RTK HDMI, 2560x1600@120, 5120x0, 1.25

# Workspaces — Xiaomi 4K is primary (1-3), laptop 4-5, portable QHD 6-9.
# Bound by description for the same reason as the geometry above.
workspace = 1, monitor:desc:Xiaomi Corporation Mi Monitor, default:true
workspace = 2, monitor:desc:Xiaomi Corporation Mi Monitor
workspace = 3, monitor:desc:Xiaomi Corporation Mi Monitor
workspace = 4, monitor:eDP-1, default:true
workspace = 5, monitor:eDP-1
workspace = 6, monitor:desc:Invalid Vendor Codename - RTK HDMI, default:true
workspace = 7, monitor:desc:Invalid Vendor Codename - RTK HDMI
workspace = 8, monitor:desc:Invalid Vendor Codename - RTK HDMI
workspace = 9, monitor:desc:Invalid Vendor Codename - RTK HDMI
