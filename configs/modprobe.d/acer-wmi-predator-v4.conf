# Predator Sense v4: force the quirk the in-kernel acer_wmi will not select here.
#
# Module: acer_wmi (in-tree, drivers/platform/x86/acer-wmi.c). The predator_v4
# parameter has existed upstream since the Predator v4 work, but the driver's
# DMI quirk table lists only PHN16-71, PH16-71 and PH18-71. The PT516-52s is
# absent, so it boots with no quirk at all. Forcing the parameter skips the DMI
# match and selects quirk_acer_predator_v4 (.hwmon, .platform_profile).
#
# What that enables, verified on this machine 2026-10-31 with a real module
# unload/reload:
#   /sys/firmware/acpi/platform_profile  -> low-power quiet balanced
#                                           balanced-performance performance
#   /sys/class/hwmon/hwmonN (name=acer)  -> fan1_input, fan2_input (real RPM;
#                                           0 at idle is genuine, this laptop
#                                           stops both fans below ~50 C),
#                                           temp1_input, temp3_input
# lm_sensors calls that chip acer-isa-0ace.
#
# What it does NOT give: quirk_acer_predator_v4 does not set .pwm, so fans are
# readable but not controllable. Nor keyboard RGB -- the in-tree acer_wmi never
# exposes four_zoned_kb; that needs an out-of-tree driver (triton-panel/README.md).
#
# The parameter is module_param(predator_v4, bool, 0444): settable only at module
# load, never writable through sysfs afterwards. Hence this file rather than an
# echo into /sys.
#
# No initramfs rebuild is needed -- acer_wmi is in no mkinitcpio MODULES list.
#
# After installing this, restart power-profiles-daemon. It probes platform
# drivers only at startup, so until it is restarted it keeps reporting
# PlatformDriver: placeholder and its profiles move only the intel_pstate EPP.
#
# Live copy: /etc/modprobe.d/acer-wmi-predator-v4.conf
# Push:      sudo install -Dm644 configs/modprobe.d/acer-wmi-predator-v4.conf /etc/modprobe.d/acer-wmi-predator-v4.conf
# Check:     cat /sys/module/acer_wmi/parameters/predator_v4   # Y = active
#            cat /sys/firmware/acpi/platform_profile           # must exist
#            sensors acer-isa-0ace                             # fan1/fan2 + temp1/temp3
options acer_wmi predator_v4=1
