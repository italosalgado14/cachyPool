# Acer battery health mode: cap charging at 80%.
# Module: acer_wmi_battery, from the AUR package acer-wmi-battery-dkms
# (https://github.com/frederik-h/acer-wmi-battery). It drives the Acer
# battery-health WMI interface (GUID 79772EC5-04B1-4BFD-843C-61E7F77B6CC9),
# the same one Acer Care Center uses on Windows. The 80% cap is fixed by the
# firmware; it is not configurable.
#
# The option re-sends the cap every time the module loads (at boot via the
# package's /usr/lib/modules-load.d/acer-wmi-battery.conf), so it survives
# reboots and any firmware/EC reset instead of relying on the EC remembering it.
#
# Live copy: /etc/modprobe.d/acer-wmi-battery.conf
# Push:      sudo install -Dm644 configs/modprobe.d/acer-wmi-battery.conf /etc/modprobe.d/acer-wmi-battery.conf
# Check:     cat /sys/bus/wmi/drivers/acer-wmi-battery/health_mode   # 1 = capped at 80%
# See ACTUAL-CONFIGURATION.md §15 and finish-installation-commands.md §14.
options acer_wmi_battery enable_health_mode=1
